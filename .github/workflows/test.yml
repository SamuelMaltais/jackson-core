name: Maven tests with differents environements et drapeaux JVM, mais pas le drapeau Français

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        MAVEN_OPTS:
          - "-Xms512m -Xmx1024m"
          - "-Xms1024m -Xmx2048m -XX:+UseG1GC"
          - "-Xms512m -Xmx2048m -XX:+UseZGC"
          - "-Xms512m -Xmx2048m -XX:+UseParallelGC"
          - "-Xms1024m -Xmx4096m -XX:+UseCompressedOops"
          - "-Xss256k"
          - "-XX:+UseThreadPriorities"
    #- "-Xms512m -Xmx2048m -XX:+UseParNewGC" N'existe pas ?

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@6a0805fcefea3d4657a47ac4c165951e33482018 # v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Capture Start Time
        run: echo "START_TIME=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Run Maven tests avec des flags, mais pas dans un parc Six Flags.
        env:
          MAVEN_OPTS: "${{ matrix.MAVEN_OPTS }}"
        run: mvn verify

      - name: Get JaCoCo Coverage
        id: coverage
        run: |
          coverage=$(python3 config/coverage.py target/site/jacoco/jacoco.csv) 
          echo "COVERAGE=$coverage" >> $GITHUB_ENV

      - name: Fail if coverage has not improved.
        run: |
          coverage=$COVERAGE
          threshold=81.58
          if (( $(echo "$coverage - $threshold <= 0.1" | bc -l) )); then
            echo "Coverage has not improved."
            exit 1
          else
            echo "New coverage: $coverage%"
          fi

      - name: Log Run Time and Coverage
        run: |
          echo "Start Time: $START_TIME" > run_log.txt
          echo "End Time: $(date '+%Y-%m-%d %H:%M:%S')" >> run_log.txt
          echo "Coverage: $COVERAGE%" >> run_log.txt
        shell: bash

      - name: Upload Log as Artifact
        uses: actions/upload-artifact@v3
        with:
          name: run-log
          path: run_log.txt
